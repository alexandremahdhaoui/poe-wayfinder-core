name: poe-wayfinder-core

artifactStorePath: .forge/artifact-store.yaml

# forge v0.42.0 ships no native Rust engines, so every stage wraps cargo
# through generic-builder and generic-test-runner.
#
# This crate holds no config and no OpenAPI spec, so it has no codegen stage.
# It is pure domain logic. It builds and it tests. Nothing else.
build:
  - name: format-code
    src: .
    engine: go://generic-builder
    spec:
      command: cargo
      args: ["fmt", "-p", "poe-wayfinder-core"]

  - name: poe-wayfinder-core
    src: ./src
    engine: go://generic-builder
    spec:
      command: cargo
      args: ["build", "-p", "poe-wayfinder-core", "--release"]

test:
  - name: lint
    runner: go://generic-test-runner
    spec:
      command: cargo
      args: ["clippy", "-p", "poe-wayfinder-core", "--all-targets", "--", "-D", "warnings"]

  - name: format-check
    runner: go://generic-test-runner
    spec:
      command: cargo
      args: ["fmt", "-p", "poe-wayfinder-core", "--", "--check"]

  - name: unit
    runner: go://generic-test-runner
    spec:
      command: cargo
      args: ["test", "-p", "poe-wayfinder-core", "--lib"]

  # The crate is pure and the same everywhere, but the target is Windows and
  # the arithmetic is not free to assume. WSL interop runs the Windows test
  # binary from here, so the domain is measured on the arch it ships to.
  - name: unit-windows
    runner: go://generic-test-runner
    spec:
      command: cargo
      args:
        [
          "test",
          "-p",
          "poe-wayfinder-core",
          "--lib",
          "--target",
          "x86_64-pc-windows-gnu",
        ]

  # Our parser against the upstream project's own 26 test items, plus the
  # hostile input suite.
  #
  # A unit test proves one stage does what I think it should. These prove the
  # whole pipeline survives items a different team wrote. The meta gem name
  # plate bug was found here and nowhere else.
  - name: conformance
    runner: go://generic-test-runner
    spec:
      command: cargo
      args: ["test", "-p", "poe-wayfinder-core", "--tests"]
