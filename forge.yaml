name: poe-trader-core

artifactStorePath: .forge/artifact-store.yaml

# forge v0.42.0 ships no native Rust engines, so every stage wraps cargo
# through generic-builder and generic-test-runner.
#
# This crate holds no config and no OpenAPI spec, so it has no codegen stage.
# It is pure domain logic. It builds and it tests. Nothing else.
build:
  - name: format-code
    src: .
    engine: go://generic-builder
    spec:
      command: cargo
      args: ["fmt", "-p", "poe-trader-core"]

  - name: poe-trader-core
    src: ./src
    engine: go://generic-builder
    spec:
      command: cargo
      args: ["build", "-p", "poe-trader-core", "--release"]

test:
  - name: lint
    runner: go://generic-test-runner
    spec:
      command: cargo
      args: ["clippy", "-p", "poe-trader-core", "--all-targets", "--", "-D", "warnings"]

  - name: format-check
    runner: go://generic-test-runner
    spec:
      command: cargo
      args: ["fmt", "-p", "poe-trader-core", "--", "--check"]

  - name: unit
    runner: go://generic-test-runner
    spec:
      command: cargo
      args: ["test", "-p", "poe-trader-core", "--lib"]

  # Our parser against the upstream project's own 26 test items, plus the
  # hostile input suite.
  #
  # A unit test proves one stage does what I think it should. These prove the
  # whole pipeline survives items a different team wrote. The meta gem name
  # plate bug was found here and nowhere else.
  - name: conformance
    runner: go://generic-test-runner
    spec:
      command: cargo
      args: ["test", "-p", "poe-trader-core", "--tests"]
